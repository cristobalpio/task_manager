<app-header></app-header>
<main>
    <ul id="users">
      @for (userg of users; track userg.id) {
      <li>
        <app-user [user]="userg",
                  [selected]="userg.id === user().id"
                  (event)="selectedUser($event)">
        </app-user>
      </li>
        }
    </ul>
    @if (user().id != '') {
        <app-tasks [user]="user()"></app-tasks>    
    }
    @else {
        <p>No user selected</p>
    }
</main>
