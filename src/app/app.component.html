<app-header></app-header>
<main>
    <ul id="users">
      @for (user of users; track user.id) {
      <li>
        <app-user [user]="user"
                  (event)="selectedUser($event)">
        </app-user>
      </li>
        }
    </ul>
    @if (user().id != '') {
        <app-tasks [user]="user()"></app-tasks>    
    }
    @else {
        <p>No user selected</p>
    }
</main>
