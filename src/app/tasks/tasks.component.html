@if (isAddingTask) {
    <new-task (cancel)="isAddingTask = false"> </new-task>
}
<section id="tasks">
    <header>
        <h2>
            {{ user().name }}'s Tasks'
        </h2>
        <menu>
            <button (click)="addTask()">Add Task </button>
        </menu>
    </header>
    @for (task of filteredTasks(); track task.id) {
        <app-task [task]="task" (task_completed)="taskCompleted($event)"> </app-task>
    }
</section>
